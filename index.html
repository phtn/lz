<!doctype html>
<html lang="en" class="scroll-smooth motion-reduce:scroll-auto">
  <head>
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('dropzone-theme')
          const isDark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch {}
      })()
    </script>
    <!--ssr-head-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="m-0 bg-background font-sans text-foreground antialiased">
    <div id="root"><!--ssr-body--></div>
  </body>
</html>
