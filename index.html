<!doctype html>
<html lang="en" class="scroll-smooth motion-reduce:scroll-auto">
  <head>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('dropzone-theme');
          const isDark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch {}
      })();
    </script>
    <!--ssr-head-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="m-0 min-h-screen min-w-80 bg-background font-sans text-foreground antialiased transition-colors duration-200 [&_*::-webkit-scrollbar]:hidden [&_a]:[-webkit-tap-highlight-color:transparent] [&_button]:[-webkit-tap-highlight-color:transparent] [&_button]:text-inherit [&_button:focus-visible]:outline-[3px] [&_button:focus-visible]:outline-ring/30 [&_button:focus-visible]:outline-offset-2 [&_a:focus-visible]:outline-[3px] [&_a:focus-visible]:outline-ring/30 [&_a:focus-visible]:outline-offset-2 [&_input:focus-visible]:outline-[3px] [&_input:focus-visible]:outline-ring/30 [&_input:focus-visible]:outline-offset-2 motion-reduce:[&_*]:!transition-none motion-reduce:[&_*]:!animate-none">
    <div id="root"><!--ssr-body--></div>
  </body>
</html>
